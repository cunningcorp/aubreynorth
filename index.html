document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

height:1.04;letter-spacing:-0.018em;margin:0 0 30px;text-wrap:pretty;color:#1b1a17\">We help businesses define the story people <em style=\"font-style:italic;color:#C0593B\">actually<\u002Fem> understand.<\u002Fh1>\n    <p style=\"font-size:clamp(18px,2vw,22px);line-height:1.6;color:#4a463e;max-width:620px;margin:0 0 40px;text-wrap:pretty\">Not branding. Not marketing. We work upstream of both, on the narrative they both depend on.<\u002Fp>\n    <div style=\"display:flex;align-items:center;gap:24px;flex-wrap:wrap\">\n      <button onclick=\"{{ goContact }}\" style=\"font-family:'Scenario',serif;font-weight:700;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:#f1ece2;background:#1b1a17;border:none;padding:16px 30px;border-radius:999px;cursor:pointer;transition:transform .25s ease,background .25s ease\" style-hover=\"background:#C0593B;transform:translateY(-2px)\">Start a conversation<\u002Fbutton>\n      <span style=\"font-size:15px;color:#8a8378\">Complimentary. No obligation.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- THE HOOK -->\n<section style=\"border-top:1px solid rgba(27,26,23,0.10)\">\n  <div data-pad=\"\" style=\"max-width:1180px;margin:0 auto;padding:108px 32px;display:grid;grid-template-columns:1fr;gap:8px\">\n    <p data-reveal=\"\" style=\"font-family:'Scenario',serif;font-weight:700;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:#8a8378;margin:0 0 22px\">The problem we name<\u002Fp>\n    <h2 data-reveal=\"\" style=\"font-family:'Recoleta',serif;font-weight:300;font-size:clamp(28px,4.4vw,52px);line-height:1.14;letter-spacing:-0.012em;margin:0 0 34px;max-width:960px;text-wrap:pretty;color:#1b1a17\">If your business isn't converting the way it should, the problem usually isn't marketing. It's that no one understands who you are.<\u002Fh2>\n    <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:40px;max-width:920px;margin-top:18px\">\n      <p style=\"font-size:18px;line-height:1.62;color:#4a463e;margin:0\">Marketing only amplifies a message. If the message underneath is unclear, louder just means more people hear something confusing.<\u002Fp>\n      <p style=\"font-size: 22px; line-height: 1.4; color: #1b1a17; margin: 0; font-style: normal\">You don't have a reach problem. You have a <span style=\"color:#C0593B\">clarity<\u002Fspan> problem.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- WHERE WE SIT -->\n<section style=\"border-top:1px solid rgba(27,26,23,0.10)\">\n  <div data-pad=\"\" style=\"max-width:1180px;margin:0 auto;padding:108px 32px\">\n    <p data-reveal=\"\" style=\"font-family:'Scenario',serif;font-weight:700;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:#8a8378;margin:0 0 22px\">Where we sit<\u002Fp>\n    <h2 data-reveal=\"\" style=\"font-family:'Recoleta',serif;font-weight:300;font-size:clamp(26px,3.6vw,42px);line-height:1.16;letter-spacing:-0.01em;margin:0 0 64px;max-width:760px;text-wrap:pretty;color:#1b1a17\">Get the story right and branding has something true to dress, and marketing has something clear to carry.<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0;border-top:1px solid rgba(27,26,23,0.14)\">\n      <div data-reveal=\"\" data-wcell=\"\" style=\"padding:38px 32px 38px 0;border-bottom:1px solid rgba(27,26,23,0.10)\">\n        <p style=\"font-family:'Scenario',serif;font-weight:700;font-size:13px;letter-spacing:0.10em;text-transform:uppercase;color:#8a8378;margin:0 0 16px\">01 · Branding<\u002Fp>\n        <p style=\"font-family:'Recoleta',serif;font-size:27px;line-height:1.2;margin:0;color:#1b1a17\">makes you <br>recognisable.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" data-wcell=\"\" style=\"padding:38px 32px;border-bottom:1px solid rgba(27,26,23,0.10);border-left:1px solid rgba(27,26,23,0.10)\">\n        <p style=\"font-family:'Scenario',serif;font-weight:700;font-size:13px;letter-spacing:0.10em;text-transform:uppercase;color:#8a8378;margin:0 0 16px\">02 · Marketing<\u002Fp>\n        <p style=\"font-family:'Recoleta',serif;font-size:27px;line-height:1.2;margin:0;color:#1b1a17\">makes you <br>heard.<\u002Fp>\n      <\u002Fdiv>\n      <div data-reveal=\"\" data-wcell=\"\" style=\"padding:38px 0 38px 32px;border-bottom:1px solid #C0593B;border-left:1px solid rgba(27,26,23,0.10);position:relative\">\n        <p style=\"font-family:'Scenario',serif;font-weight:700;font-size:13px;letter-spacing:0.10em;text-transform:uppercase;color:#C0593B;margin:0 0 16px\">03 · Narrative<\u002Fp>\n        <p style=\"font-family:'Recoleta',serif;font-size:27px;line-height:1.2;margin:0;color:#1b1a17\">makes you <em style=\"font-style:italic;color:#C0593B\">understood.<\u002Fem><\u002Fp>\n        <p style=\"font-size:14px;color:#8a8378;margin:18px 0 0\">We do the third — so the first two can work.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- SAY LESS — dark centerpiece -->\n<section id=\"sayless\" style=\"background:#201e1a;color:#f1ece2;position:relative;overflow:hidden\">\n  <div data-deco=\"\" style=\"position:absolute;top:84px;right:64px;width:120px;height:120px;animation:anDrift 8s ease-in-out infinite\" aria-hidden=\"true\">\n    <div style=\"position:absolute;inset:0;border-radius:50%;border:1px solid rgba(192,89,59,0.40);animation:anPulseRing 4s ease-out infinite\"><\u002Fdiv>\n    <div style=\"position:absolute;inset:0;border-radius:50%;border:1px solid rgba(192,89,59,0.22)\"><\u002Fdiv>\n    <div style=\"position:absolute;inset:0;animation:anOrbit 11s linear infinite\">\n      <div style=\"position:absolute;top:-3.5px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#C0593B\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center\">\n      <div style=\"width:13px;height:13px;border-radius:50%;background:#C0593B;animation:anBreathe 3.6s ease-in-out infinite,anGlow 3.6s ease-in-out infinite\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div data-pad=\"\" style=\"max-width:1180px;margin:0 auto;padding:116px 32px;position:relative\">\n    <p data-reveal=\"\" data-avoid=\"\" style=\"font-family:'Scenario',serif;font-weight:700;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:#C0593B;margin:0 0 22px\">The 1/8th principle<\u002Fp>\n    <h2 data-reveal=\"\" data-avoid=\"\" style=\"font-family:'Recoleta',serif;font-weight:300;font-size:clamp(30px,5vw,60px);line-height:1.06;letter-spacing:-0.015em;margin:0 0 20px;max-width:840px;text-wrap:pretty;color:#f6f3ec\">We don't help you say more. We help you say <em style=\"font-style:italic;color:#C0593B\">less<\u002Fem>, and make it land.<\u002Fh2>\n    <p data-reveal=\"\" data-avoid=\"\" style=\"font-size:18px;line-height:1.6;color:#b3ab9c;max-width:600px;margin:0 0 56px\">You don't pitch everything you can do. We help you choose the eighth that lands — the one that earns you the right to the rest. Try it:<\u002Fp>\n\n    <div data-reveal=\"\" data-avoid=\"\" style=\"border:1px solid rgba(241,236,226,0.16);border-radius:6px;overflow:hidden;max-width:920px;background:#1b1a17\">\n      <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 26px;border-bottom:1px solid rgba(241,236,226,0.12);flex-wrap:wrap\">\n        <div style=\"display:flex;align-items:baseline;gap:14px\">\n          <span style=\"font-family:'Scenario',serif;font-weight:700;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#8a8378\">The pitch ·<\u002Fspan>\n          <span style=\"font-family:'Scenario',serif;font-weight:700;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#f1ece2\">{{ lengthLabel }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:8px\">\n          <span style=\"font-family:'Scenario',serif;font-weight:700;font-size:30px;color:#C0593B;line-height:1;font-variant-numeric:tabular-nums\">{{ wordCount }}<\u002Fspan>\n          <span style=\"font-size:13px;letter-spacing:0.1em;text-transform:uppercase;color:#8a8378;font-family:'Scenario',serif\">words<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:42px 26px;min-height:188px;display:flex;align-items:center\">\n        {{ pitchEl }}\n      <\u002Fdiv>\n      <div data-pnav=\"\" style=\"display:flex;align-items:stretch;border-top:1px solid rgba(241,236,226,0.12)\">\n        <button onclick=\"{{ sayLess }}\" disabled=\"{{ atMin }}\" style=\"{{ lessBtnStyle }}\">← Say less<\u002Fbutton>\n        <div style=\"display:flex;align-items:center;gap:9px;padding:0 22px;border-left:1px solid rgba(241,236,226,0.12);border-right:1px solid rgba(241,236,226,0.12)\">\n          {{ dotsEl }}\n        <\u002Fdiv>\n        <button onclick=\"{{ sayMore }}\" disabled=\"{{ atMax }}\" style=\"{{ moreBtnStyle }}\">Say more →<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p data-reveal=\"\" data-avoid=\"\" style=\"font-size:14px;color:#6f6a60;margin:22px 0 0;font-style:italic\">Restraint is the craft. We subtract until it's true.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- HOW WE WORK -->\n<section id=\"work\" style=\"border-top:1px solid rgba(27,26,23,0.10)\">\n  <div data-pad=\"\" style=\"max-width:1180px;margin:0 auto;padding:112px 32px\">\n    <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:56px\">\n      <div data-reveal=\"\">\n        <p style=\"font-family:'Scenario',serif;font-weight:700;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:#8a8378;margin:0 0 22px\">How we work<\u002Fp>\n        <h2 style=\"font-family:'Recoleta',serif;font-weight:300;font-size:clamp(28px,4vw,48px);line-height:1.1;letter-spacing:-0.012em;margin:0;max-width:640px;text-wrap:pretty;color:#1b1a17\">We work in the next three to six months — not the next ten years.<\u002Fh2>\n      <\u002Fdiv>\n      <p data-reveal=\"\" style=\"font-size:15px;color:#8a8378;max-width:240px;margin:0\">Boutique by design. Select markets.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"border-top:1px solid rgba(27,26,23,0.16)\">\n      <sc-for list=\"{{ tiers }}\" as=\"tier\" hint-placeholder-count=\"4\">\n        <div data-reveal=\"\" data-tier=\"\" style=\"display:grid;grid-template-columns:54px 1fr auto;gap:28px;align-items:start;padding:34px 0;border-bottom:1px solid rgba(27,26,23,0.10)\">\n          <span style=\"font-family:'Scenario',serif;font-weight:700;font-size:14px;color:#C0593B;padding-top:6px\">{{ tier.no }}<\u002Fspan>\n          <div>\n            <h3 style=\"font-family:'Recoleta',serif;font-weight:300;font-size:clamp(22px,2.6vw,30px);line-height:1.12;margin:0 0 10px;color:#1b1a17\">{{ tier.name }}<\u002Fh3>\n            <p style=\"font-size:16px;line-height:1.55;color:#6f6a60;margin:0;max-width:560px\">{{ tier.desc }}<\u002Fp>\n          <\u002Fdiv>\n          <span style=\"font-family:'Scenario',serif;font-weight:700;font-size:clamp(16px,1.8vw,21px);color:#1b1a17;white-space:nowrap;text-align:right;padding-top:4px\" data-price=\"\">{{ tier.price }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CONTACT -->\n<section id=\"contact\" style=\"background:#201e1a;color:#f1ece2;border-top:1px solid rgba(27,26,23,0.10);position:relative;overflow:hidden\">\n  <div data-deco=\"\" style=\"position:absolute;bottom:72px;left:50%;width:104px;height:104px;animation:anDrift 9s ease-in-out infinite\" aria-hidden=\"true\">\n    <div style=\"position:absolute;inset:0;border-radius:50%;border:1px solid rgba(192,89,59,0.38);animation:anPulseRing 4.4s ease-out infinite\"><\u002Fdiv>\n    <div style=\"position:absolute;inset:0;border-radius:50%;border:1px solid rgba(192,89,59,0.20)\"><\u002Fdiv>\n    <div style=\"position:absolute;inset:0;animation:anOrbit 12s linear infinite\">\n      <div style=\"position:absolute;top:-3px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:#C0593B\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center\">\n      <div style=\"width:11px;height:11px;border-radius:50%;background:#C0593B;animation:anBreathe 3.6s ease-in-out infinite,anGlow 3.6s ease-in-out infinite\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div data-pad=\"\" style=\"max-width:1180px;margin:0 auto;padding:116px 32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:64px;position:relative\">\n    <div data-reveal=\"\" data-avoid=\"\">\n      <p style=\"font-family:'Scenario',serif;font-weight:700;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:#C0593B;margin:0 0 22px\">Coffee + Chat<\u002Fp>\n      <h2 style=\"font-family:'Recoleta',serif;font-weight:300;font-size:clamp(30px,4.4vw,52px);line-height:1.08;letter-spacing:-0.014em;margin:0 0 26px;text-wrap:pretty;color:#f6f3ec\">A relaxed conversation about where the friction is.<\u002Fh2>\n      <p style=\"font-size:18px;line-height:1.62;color:#b3ab9c;max-width:420px;margin:0 0 40px\">Tell us about the business, where it is, where you want it — and most of all, what you want a customer to feel on contact. Complimentary. No obligation.<\u002Fp>\n      <div style=\"display:flex;align-items:baseline;gap:0.4em\">\n        <span style=\"font-family:'Recoleta',serif;font-size:15px;color:#b3ab9c\">the<\u002Fspan>\n        <span style=\"font-family:'Scenario',serif;font-weight:700;font-size:22px;letter-spacing:-0.01em;color:#f1ece2\">AUBREY&nbsp;NORTH<\u002Fspan>\n        <span style=\"font-family:'Recoleta',serif;font-size:13px;color:#8a8378\">company<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-reveal=\"\" data-avoid=\"\">\n      <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"border:1px solid rgba(192,89,59,0.5);border-radius:6px;padding:48px 36px;background:#1b1a17\">\n          <p style=\"font-family:'Scenario',serif;font-weight:700;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#C0593B;margin:0 0 18px\">Received<\u002Fp>\n          <p style=\"font-family:'Recoleta',serif;font-size:28px;line-height:1.2;margin:0 0 14px;color:#f6f3ec\">We'll be in touch.<\u002Fp>\n          <p style=\"font-size:16px;color:#b3ab9c;margin:0\">Thank you, {{ sentName }}. Expect a reply within two working days — no obligation, no pitch.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n        <form onsubmit=\"{{ submit }}\" style=\"display:flex;flex-direction:column;gap:22px\">\n          <div data-formrow=\"\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px\">\n            <label style=\"display:flex;flex-direction:column;gap:9px\">\n              <span style=\"font-family:'Scenario',serif;font-weight:700;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8a8378\">Your name<\u002Fspan>\n              <input value=\"{{ fName }}\" oninput=\"{{ onName }}\" placeholder=\"Jane Aubrey\" style=\"font-family:'Futura','Helvetica Neue',Arial,sans-serif;font-size:17px;color:#f1ece2;background:transparent;border:none;border-bottom:1px solid rgba(241,236,226,0.28);padding:10px 0;outline:none;transition:border-color .25s ease\" style-focus=\"border-color:#C0593B\">\n            <\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:9px\">\n              <span style=\"font-family:'Scenario',serif;font-weight:700;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8a8378\">Business<\u002Fspan>\n              <input value=\"{{ fBiz }}\" oninput=\"{{ onBiz }}\" placeholder=\"North &amp; Co.\" style=\"font-family:'Futura','Helvetica Neue',Arial,sans-serif;font-size:17px;color:#f1ece2;background:transparent;border:none;border-bottom:1px solid rgba(241,236,226,0.28);padding:10px 0;outline:none;transition:border-color .25s ease\" style-focus=\"border-color:#C0593B\">\n            <\u002Flabel>\n          <\u002Fdiv>\n          <label style=\"display:flex;flex-direction:column;gap:9px\">\n            <span style=\"font-family:'Scenario',serif;font-weight:700;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8a8378\">Email<\u002Fspan>\n            <input value=\"{{ fEmail }}\" oninput=\"{{ onEmail }}\" placeholder=\"jane@northco.uk\" style=\"font-family:'Futura','Helvetica Neue',Arial,sans-serif;font-size:17px;color:#f1ece2;background:transparent;border:none;border-bottom:1px solid rgba(241,236,226,0.28);padding:10px 0;outline:none;transition:border-color .25s ease\" style-focus=\"border-color:#C0593B\">\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:9px\">\n            <span style=\"font-family:'Scenario',serif;font-weight:700;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8a8378\">What should a customer feel on contact?<\u002Fspan>\n            <textarea value=\"{{ fMsg }}\" oninput=\"{{ onMsg }}\" rows=\"3\" placeholder=\"In a sentence or two…\" style=\"font-family:'Futura','Helvetica Neue',Arial,sans-serif;font-size:17px;color:#f1ece2;background:transparent;border:none;border-bottom:1px solid rgba(241,236,226,0.28);padding:10px 0;outline:none;resize:none;transition:border-color .25s ease\" style-focus=\"border-color:#C0593B\"><\u002Ftextarea>\n          <\u002Flabel>\n          <div style=\"min-height:18px\">\n            <sc-if value=\"{{ hasError }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"font-size:13px;color:#C0593B;font-style:italic\">{{ errorMsg }}<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <button type=\"submit\" disabled=\"{{ sending }}\" style=\"align-self:flex-start;font-family:'Scenario',serif;font-weight:700;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:#1b1a17;background:#f1ece2;border:none;padding:16px 32px;border-radius:999px;cursor:pointer;transition:transform .25s ease,background .25s ease,opacity .25s ease\" style-hover=\"background:#C0593B;color:#f6f3ec;transform:translateY(-2px)\">{{ submitLabel }}<\u002Fbutton>\n          <p style=\"font-size:13px;line-height:1.55;color:#6f6a60;margin:6px 0 0;max-width:440px\">Your details stay with us — used only to reply to this enquiry, never shared or added to a list. Read our <a href=\"#\" style=\"color:#8a8378;text-decoration:underline;text-underline-offset:2px\">privacy notice<\u002Fa>.<\u002Fp>\n        <\u002Fform>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOOTER -->\n<footer style=\"background:#201e1a;color:#6f6a60;border-top:1px solid rgba(241,236,226,0.10)\">\n  <div data-nav=\"\" style=\"max-width:1180px;margin:0 auto;padding:34px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap\">\n    <p style=\"font-size:13px;line-height:1.5;margin:0;max-width:640px\">Aubrey North is a trading name of Cunning Corp Ltd, registered in England and Wales, and of Maurice James LLC-FZ, Dubai, UAE. Strategic and commercial advisory only — not legal or financial advice.<\u002Fp>\n    <p style=\"font-family:'Scenario',serif;font-weight:700;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;margin:0;color:#8a8378\">Clarity · Story · Understanding<\u002Fp>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  FORM_ENDPOINT = 'https://formspree.io/f/xzdqnogz';\n\n  state = {\n    idx: 3,\n    fName: '', fBiz: '', fEmail: '', fMsg: '',\n    error: '', sent: false, sentName: '', sending: false\n  };\n\n  pitches = [\n    { label: 'Three words', text: 'Clarity. Story. Understanding.', size: 'clamp(40px,7vw,86px)', lh: '1.04' },\n    { label: 'One line', text: 'We help businesses define the story people actually understand.', size: 'clamp(26px,4vw,46px)', lh: '1.14' },\n    { label: 'Short', text: 'Not branding, not marketing. We work on the narrative underneath both — because before any of it works, your business has to make sense to a human being. We help you say less, and make it land.', size: 'clamp(19px,2.3vw,27px)', lh: '1.42' },\n    { label: 'Fuller', text: 'Most businesses that aren\\u2019t converting don\\u2019t have a marketing problem — they have a clarity problem. No one quite understands who they are. Aubrey North is a boutique narrative advisory. We strip a business back to what it actually is, what its customer actually feels, and where the two have come apart — then rebuild the story so it lands immediately, feels intentional, and earns trust. We don\\u2019t help you say more. We help you say less, clearly.', size: 'clamp(16px,1.7vw,20px)', lh: '1.55' }\n  ];\n\n  countWords(t) {\n    return t.replace(/[\\u2014—.,]/g, ' ').split(/\\s+/).filter(Boolean).length;\n  }\n\n  componentDidMount() {\n    const els = Array.from(document.querySelectorAll('[data-reveal]'));\n    const show = (el) => { el.style.opacity = '1'; el.style.transform = 'none'; };\n    els.forEach(el => {\n      el.style.opacity = '0';\n      el.style.transform = 'translateY(20px)';\n      el.style.transition = 'opacity .9s cubic-bezier(.2,.7,.2,1), transform .9s cubic-bezier(.2,.7,.2,1)';\n    });\n    // Reveal anything already in (or near) the viewport right away — robust across bundlers/splash unpack.\n    const revealInView = () => {\n      const vh = window.innerHeight || document.documentElement.clientHeight;\n      els.forEach(el => {\n        if (el.style.opacity === '1') return;\n        const r = el.getBoundingClientRect();\n        if (r.top < vh * 0.94 && r.bottom > 0) show(el);\n      });\n    };\n    revealInView();\n    if (!('IntersectionObserver' in window)) {\n      els.forEach(show);\n      return;\n    }\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach(e => { if (e.isIntersecting) { show(e.target); io.unobserve(e.target); } });\n    }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });\n    els.forEach(el => { if (el.style.opacity !== '1') io.observe(el); });\n    // Safety nets: re-check after paint, and guarantee nothing stays hidden.\n    requestAnimationFrame(revealInView);\n    setTimeout(revealInView, 300);\n    this._revealSafety = setTimeout(() => els.forEach(show), 1600);\n\n    this.initFloatMarks();\n  }\n\n  initFloatMarks() {\n    const marks = Array.from(document.querySelectorAll('[data-floatmark]'));\n    if (!marks.length) return;\n    const mq = (q) => window.matchMedia && window.matchMedia(q).matches;\n    if (mq('(max-width: 768px)')) return; // marks are hidden on mobile\n    const reduce = mq('(prefers-reduced-motion: reduce)');\n\n    this._marks = marks.map((el, i) => {\n      const speed = 0.42 + i * 0.06;\n      const dir = i % 2 === 0 ? 1 : -1;\n      return {\n        el, parent: el.parentElement,\n        x: 0, y: 0,\n        vx: speed * dir,\n        vy: speed * (i === 2 ? -0.9 : 0.8),\n        w: 0, h: 0, pw: 0, ph: 0, avoid: [], placed: false\n      };\n    });\n\n    this._measureMarks = () => {\n      this._marks.forEach(m => {\n        const pr = m.parent.getBoundingClientRect();\n        m.pw = m.parent.clientWidth;\n        m.ph = m.parent.clientHeight;\n        m.w = m.el.offsetWidth || 120;\n        m.h = m.el.offsetHeight || 120;\n        m.avoid = Array.from(m.parent.querySelectorAll('[data-avoid]')).map(a => {\n          const r = a.getBoundingClientRect();\n          return { x: r.left - pr.left, y: r.top - pr.top, w: r.width, h: r.height };\n        });\n        if (!m.placed) {\n          const anchor = m.el.getAttribute('data-anchor') || 'tr';\n          if (anchor === 'bc') { m.x = (m.pw - m.w) / 2; m.y = m.ph - m.h - 56; }\n          else if (anchor === 'tl') { m.x = 40; m.y = 64; }\n          else { m.x = m.pw - m.w - 40; m.y = 64; }\n          m.placed = true;\n        }\n      });\n    };\n    this._measureMarks();\n    this._marks.forEach(m => { m.el.style.transform = 'translate(' + m.x + 'px,' + m.y + 'px)'; });\n    if (reduce) return; // place statically, no motion\n\n    const margin = 16, gap = 12;\n    this._stepMarks = () => {\n      for (const m of this._marks) {\n        if (!m.pw) continue;\n        m.x += m.vx; m.y += m.vy;\n        if (m.x < margin) { m.x = margin; m.vx = Math.abs(m.vx); }\n        if (m.x > m.pw - m.w - margin) { m.x = m.pw - m.w - margin; m.vx = -Math.abs(m.vx); }\n        if (m.y < margin) { m.y = margin; m.vy = Math.abs(m.vy); }\n        if (m.y > m.ph - m.h - margin) { m.y = m.ph - m.h - margin; m.vy = -Math.abs(m.vy); }\n        for (const r of m.avoid) {\n          if (m.x < r.x + r.w + gap && m.x + m.w + gap > r.x && m.y < r.y + r.h + gap && m.y + m.h + gap > r.y) {\n            const dL = (m.x + m.w) - (r.x - gap);\n            const dR = (r.x + r.w + gap) - m.x;\n            const dT = (m.y + m.h) - (r.y - gap);\n            const dB = (r.y + r.h + gap) - m.y;\n            const mn = Math.min(dL, dR, dT, dB);\n            if (mn === dL) { m.x = r.x - gap - m.w; m.vx = -Math.abs(m.vx); }\n            else if (mn === dR) { m.x = r.x + r.w + gap; m.vx = Math.abs(m.vx); }\n            else if (mn === dT) { m.y = r.y - gap - m.h; m.vy = -Math.abs(m.vy); }\n            else { m.y = r.y + r.h + gap; m.vy = Math.abs(m.vy); }\n          }\n        }\n        m.el.style.transform = 'translate(' + m.x.toFixed(2) + 'px,' + m.y.toFixed(2) + 'px)';\n      }\n      this._marksRaf = requestAnimationFrame(this._stepMarks);\n    };\n    this._marksRaf = requestAnimationFrame(this._stepMarks);\n\n    this._onMarksResize = () => { this._marks.forEach(m => m.placed = m.placed); this._measureMarks(); };\n    window.addEventListener('resize', this._onMarksResize);\n    setTimeout(this._measureMarks, 500);\n    setTimeout(this._measureMarks, 1800);\n  }\n\n  componentWillUnmount() {\n    if (this._revealSafety) clearTimeout(this._revealSafety);\n    if (this._marksRaf) cancelAnimationFrame(this._marksRaf);\n    if (this._onMarksResize) window.removeEventListener('resize', this._onMarksResize);\n  }\n\n  goContact = () => {\n    const el = document.getElementById('contact');\n    if (el) {\n      const top = el.getBoundingClientRect().top + window.scrollY - 0;\n      window.scrollTo({ top, behavior: 'smooth' });\n    }\n  };\n\n  sayLess = () => this.setState(s => ({ idx: Math.max(0, s.idx - 1) }));\n  sayMore = () => this.setState(s => ({ idx: Math.min(this.pitches.length - 1, s.idx + 1) }));\n  setIdx = (i) => this.setState({ idx: i });\n\n  onName = (e) => this.setState({ fName: e.target.value, error: '' });\n  onBiz = (e) => this.setState({ fBiz: e.target.value });\n  onEmail = (e) => this.setState({ fEmail: e.target.value, error: '' });\n  onMsg = (e) => this.setState({ fMsg: e.target.value, error: '' });\n\n  submit = async (e) => {\n    e.preventDefault();\n    if (this.state.sending) return;\n    const { fName, fBiz, fEmail, fMsg } = this.state;\n    if (!fName.trim()) return this.setState({ error: 'A name, to start.' });\n    if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(fEmail.trim())) return this.setState({ error: 'A real email, so we can reply.' });\n    if (!fMsg.trim()) return this.setState({ error: 'One line on what a customer should feel.' });\n\n    this.setState({ sending: true, error: '' });\n    try {\n      const res = await fetch(this.FORM_ENDPOINT, {\n        method: 'POST',\n        headers: { 'Accept': 'application/json' },\n        body: (() => {\n          const fd = new FormData();\n          fd.append('name', fName.trim());\n          fd.append('business', fBiz.trim());\n          fd.append('email', fEmail.trim());\n          fd.append('feeling', fMsg.trim());\n          fd.append('_subject', 'New Coffee + Chat enquiry — ' + fName.trim());\n          return fd;\n        })()\n      });\n      if (res.ok) {\n        this.setState({ sent: true, sending: false, sentName: fName.trim().split(/\\s+/)[0] });\n      } else {\n        let msg = 'Something went wrong sending that. Email us directly and we\\u2019ll sort it.';\n        try {\n          const data = await res.json();\n          if (data && data.errors && data.errors.length) msg = data.errors.map(x => x.message).join(' ');\n        } catch (_) {}\n        this.setState({ sending: false, error: msg });\n      }\n    } catch (_) {\n      this.setState({ sending: false, error: 'Network hiccup — check your connection and try once more.' });\n    }\n  };\n\n  renderVals() {\n    const p = this.pitches[this.state.idx];\n    const accent = '#C0593B';\n\n    const pitchEl = React.createElement('p', {\n      key: this.state.idx,\n      style: {\n        fontFamily: \"'Recoleta', Georgia, serif\", fontWeight: 300,\n        fontSize: p.size, lineHeight: p.lh, letterSpacing: '-0.01em',\n        margin: 0, color: '#f6f3ec', textWrap: 'pretty',\n        animation: 'anFade .55s cubic-bezier(.2,.7,.2,1) both'\n      }\n    }, p.text);\n\n    const dotsEl = this.pitches.map((pp, i) => React.createElement('button', {\n      key: i,\n      onClick: () => this.setIdx(i),\n      title: pp.label,\n      style: {\n        width: i === this.state.idx ? '22px' : '8px', height: '8px',\n        borderRadius: '999px', border: 'none', cursor: 'pointer', padding: 0,\n        background: i === this.state.idx ? accent : 'rgba(241,236,226,0.30)',\n        transition: 'all .3s cubic-bezier(.2,.7,.2,1)'\n      }\n    }));\n\n    const baseBtn = {\n      flex: 1, fontFamily: \"'Scenario', serif\", fontWeight: 700, fontSize: '12px',\n      letterSpacing: '0.12em', textTransform: 'uppercase', padding: '20px 22px',\n      border: 'none', cursor: 'pointer', transition: 'background .25s ease, color .25s ease',\n      background: 'transparent'\n    };\n    const atMin = this.state.idx === 0;\n    const atMax = this.state.idx === this.pitches.length - 1;\n\n    return {\n      lengthLabel: p.label,\n      wordCount: this.countWords(p.text),\n      pitchEl, dotsEl,\n      sayLess: this.sayLess, sayMore: this.sayMore,\n      atMin, atMax,\n      lessBtnStyle: { ...baseBtn, color: atMin ? '#5a554c' : '#f1ece2', cursor: atMin ? 'default' : 'pointer' },\n      moreBtnStyle: { ...baseBtn, color: atMax ? '#5a554c' : '#f1ece2', cursor: atMax ? 'default' : 'pointer' },\n      goContact: this.goContact,\n      tiers: [\n        { no: '01', name: 'Coffee + Chat', desc: 'A relaxed, focused conversation about how you see the business and where the friction is.', price: 'Complimentary' },\n        { no: '02', name: 'The One Recommendation', desc: 'A single, focused fix on the most critical issue, delivered as an Aubrey North Note.', price: '£500' },\n        { no: '03', name: 'Weekly Intensive', desc: 'Focused weekly sprints to identify and fix the core narrative issues. Most run two to three weeks.', price: '£2,500 / week' },\n        { no: '04', name: 'Ongoing Advisory', desc: 'By invitation. For businesses that want a steady hand on the narrative over time.', price: '£1–2k / month' }\n      ],\n      sent: this.state.sent,\n      notSent: !this.state.sent,\n      sentName: this.state.sentName,\n      fName: this.state.fName, fBiz: this.state.fBiz, fEmail: this.state.fEmail, fMsg: this.state.fMsg,\n      onName: this.onName, onBiz: this.onBiz, onEmail: this.onEmail, onMsg: this.onMsg,\n      submit: this.submit,\n      sending: this.state.sending,\n      submitLabel: this.state.sending ? 'Sending…' : 'Request a coffee',\n      hasError: !!this.state.error, errorMsg: this.state.error\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
