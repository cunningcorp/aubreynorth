  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    const templateData = JSON.parse(templateEl.textContent);
    const pages = templateData.pages;
    const entryId = templateData.entry;
    const pageIds = Object.keys(pages);

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : {};

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');

        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));

    // file:// document inherit a null origin, so crossorigin forces a CORS
    // fetch that SRI then rejects — the manifest bytes are ours; SRI protects
    // against CDN compromise, not this), and inject the page's own
    // window.__resources + the click interceptor into <head>. slice() rather
    // than replace() keeps us clear of $-pattern substitution.

      }

      // a blanket <base target="_parent"> would also redirect form submissions
      // and tear down the wrapper. Non-# links navigate the parent to the
      // anchor's resolved href; #/… routes forward to the parent's hash only
      // when the id is one of this bundle's own pages (author #/… links from
      // an in-page hash router are left to the scroll path so they don't yank
      // the user to the entry page); plain #frag scrolls in place.

      // anchors, which closest()/IDL .target get wrong.

            'if (h.charAt(0) !== "#") {' +

              'return;' +
            '}' +
            'e.preventDefault();' +
            'if (h.slice(0, 2) === "#/") {' +
              'var c = h.indexOf(":", 2);' +
              'var pid = c < 0 ? h.slice(2) : h.slice(2, c);' +
              'try { pid = decodeURIComponent(pid); } catch(err) {}' +
              'if (window.__bundler_pages.indexOf(pid) >= 0) { parent.location.hash = h; return; }' +
            '}' +
            'var t = h.length > 1 ? document.getElementById(h.slice(1)) : null;' +
            'if (t) t.scrollIntoView({behavior:"smooth"});' +
            'else scrollTo({top:0, behavior:"smooth"});' +
          '});' : '');

      // ids) before wrapping — same escape level as every sibling JSON island.
      var headScript = '<script>' +
        headContent.split('</' + 'script').join('<\\/' + 'script') +
        '</' + 'script>';
      // Inject after <head> so the DOCTYPE stays first; prepending the script
      // would push the parser into quirks mode. DOMParser always emits a <head>
      // (synthesizing one if the source HTML omitted it) but may carry
      // attributes through, so match the full opening tag.

      if (headOpen) {
        var hi = headOpen.index + headOpen[0].length;
        t = t.slice(0, hi) + headScript + t.slice(hi);
      }
      pages[id] = t;
    }

    setStatus('Rendering...');

    if (pageIds.length === 1) {
      // Single page: the pre-crawl render path. Parse the template and swap the
      // root element. Scripts inserted via DOMParser/replaceWith are inert per
      // spec — re-create each with createElement so they execute, awaiting
      // onload for src scripts to preserve ordering (React before ReactDOM
      // before Babel before text/babel).

      const doc = new DOMParser().parseFromString(template, 'text/html');
      document.documentElement.replaceWith(doc.documentElement);
      const dead = Array.from(document.scripts);
      for (const old of dead) {
        const s = document.createElement('script');
        for (const a of old.attributes) s.setAttribute(a.name, a.value);
        s.textContent = old.textContent;
        // text/babel scripts with a src: fetch and inline. transformScriptTags
        // does XHR against the src, but blob:null/ from a file:// origin is
        // silently dropped. Inlining makes it a plain inline babel script,
        // which transformScriptTags handles unconditionally.
        if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
          try {
            const r = await fetch(s.src);
            s.textContent = await r.text();
            s.removeAttribute('src');
          } catch (e) {}
        }
        // Non-executable script types (text/babel, application/json, …) are
        // data blocks per spec: the browser never fetches src and never fires
        // load/error, so awaiting would hang forever.
        const exec = !s.type || s.type === 'module' || /(java|ecma)script/i.test(s.type);
        const p = (s.src && exec) ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
        old.replaceWith(s);
        if (p) await p;
      }
      // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
      // which fired before we swapped the document. Trigger manually if present.
      if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
        window.Babel.transformScriptTags();
      }
      return;
    }

    // Multi-page: render into a full-viewport srcdoc iframe so each page runs
    // in its own realm while staying same-origin with the parent (so asset
    // blob URLs load and parent.location is writable).
    var frame = document.createElement('iframe');
    frame.id = '__bundler_frame';
    frame.setAttribute('style', 'position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff');
    document.body.appendChild(frame);

    function decode(s) {
      try { return decodeURIComponent(s); } catch (e) { return s; }
    }
    function route() {
      var h = (location.hash || '');
      if (h.slice(0, 2) !== '#/') return { id: entryId, anchor: '' };
      h = h.slice(2);
      var i = h.indexOf(':');
      return i < 0 ? { id: decode(h), anchor: '' }
                   : { id: decode(h.slice(0, i)), anchor: decode(h.slice(i + 1)) };
    }

    var current = null;
    var navGen = 0;
    function navigate() {
      var r = route();
      var id = Object.prototype.hasOwnProperty.call(pages, r.id) ? r.id : entryId;
      if (current === id) {
        // Same-page anchor change: the iframe's own hash handles this, so
        // normally we don't reach here. If we do (e.g. a programmatic
        // parent.location.hash change), nudge the iframe.
        var cw = frame.contentWindow;
        if (!cw) return;
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
        else cw.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      current = id;
      var gen = ++navGen;
      frame.onload = function() {
        // One-shot: an iframe-internal navigation (form submit, page JS
        // location.href=) re-fires onload with the same gen; after that the
        // iframe may be cross-origin, and cw.* access would throw.
        frame.onload = null;
        if (gen !== navGen) return;
        var cw = frame.contentWindow;
        try { cw.document.title && (document.title = cw.document.title); } catch (e) {}
        var splash = document.getElementById('__bundler_thumbnail') ||
                     document.getElementById('__bundler_placeholder');
        if (splash) splash.remove();
        if (loading) loading.remove();
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView();
        else cw.scrollTo(0, 0);
      };
      frame.srcdoc = pages[id];
    }

    window.addEventListener('hashchange', navigate);
    navigate();
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

52px);line-height:1.14;letter-spacing:-0.012em;margin:0 0 34px;max-width:960px;text-wrap:pretty;color:#1b1a17\">If your business isn't converting the way it should, the problem usually isn't marketing. It's that no one understands who you are.<\u002Fh2>\n    <div data-reveal=\"\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:40px;max-width:920px;margin-top:18px\">\n      <p style=\"font-size:18px;line-height:1.62;color:#4a463e;margin:0\">Marketing only amplifies a message. If the message underneath is unclear, louder just means more people hear something confusing.<\u002Fp>\n      <p style=\"font-size: 22px; line-height: 1.4; color: #1b1a17; margin: 0; font-style: normal\">You don't have a reach problem. You have a <span style=\"color:#C0593B\">clarity<\u002Fspan> problem.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- WHERE WE SIT -->\n<section style=\"border-top:1px solid rgba(27,26,23,0.10)\">\n  <div data-pad=\"\" style=\"max-width:1180px;margin:0 auto;padding:108px 32px\">\n    <p data-reveal=\"\" style=\"font-family:'Scenario',serif;font-weight:700;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:#8a8378;margin:0 0 22px\">Where we sit<\u002Fp>\n    <h2 data-reveal=\"\" style=\"font-family:'Recoleta',serif;font-weight:300;font-size:clamp(26px,3.6vw,42px);line-height:1.16;letter-spacing:-0.01em;margin:0 0 64px;max-width:760px;text-wrap:pretty;color:#1b1a17\">Get the story right and branding has something true to dress, and marketing has something clear to carry.<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0;border-top:1px solid rgba(27,26,23,0.14)\">\n      <div data-reveal=\"\" data-wcell=\"\" style=\"padding:38px 32px 38px 0;border-bottom:1px solid rgba(27,26,23,0.10)\">\n        <p style=\"font-family:'Scenario',serif;font-weight:700;font-size:13px;letter-spacing:0.10em;text-transform:uppercase;color:#8a8378;margin:0 0 16px\">01 tyle=\"font-family:'Scenario',serif;font-weight:700;font-size:22px;letter-spacing:-0.01em;color:#f1ece2\">AUBREY&nbsp;NORTH<\u002Fspan>\n        <span style=\"font-family:'Recoleta',serif;font-size:13px;color:#8a8378\">company<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div data-reveal=\"\" data-avoid=\"\">\n      <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"border:1px solid rgba(192,89,59,0.5);border-radius:6px;padding:48px 36px;background:#1b1a17\">\n          <p style=\"font-family:'Scenario',serif;font-weight:700;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:#C0593B;margin:0 0 18px\">Received<\u002Fp>\n          <p style=\"font-family:'Recoleta',serif;font-size:28px;line-height:1.2;margin:0 0 14px;color:#f6f3ec\">We'll be in touch.<\u002Fp>\n          <p style=\"font-size:16px;color:#b3ab9c;margin:0\">Thank you, {{ sentName }}. Expect a reply within two working days — no obligation, no pitch.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ notSent }}\" hint-placeholder-val=\"{{ true }}\">\n        <form onsubmit=\"{{ submit }}\" style=\"display:flex;flex-direction:column;gap:22px\">\n          <div data-formrow=\"\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px\">\n            <label style=\"display:flex;flex-direction:column;gap:9px\">\n              <span style=\"font-family:'Scenario',serif;font-weight:700;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8a8378\">Your name<\u002Fspan>\n              <input value=\"{{ fName }}\" oninput=\"{{ onName }}\" placeholder=\"Jane Aubrey\" style=\"font-family:'Futura','Helvetica Neue',Arial,sans-serif;font-size:17px;color:#f1ece2;background:transparent;border:none;border-bottom:1px solid rgba(241,236,226,0.28);padding:10px 0;outline:none;transition:border-color .25s ease\" style-focus=\"border-color:#C0593B\">\n            <\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:9px\">\n              <span style=\"font-family:'Scenario',serif;font-weight:700;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8a8378\">Business<\u002Fspan>\n              <input value=\"{{ fBiz }}\" oninput=\"{{ onBiz }}\" placeholder=\"North &amp; Co.\" style=\"font-family:'Futura','Helvetica Neue',Arial,sans-serif;font-size:17px;color:#f1ece2;background:transparent;border:none;border-bottom:1px solid rgba(241,236,226,0.28);padding:10px 0;outline:none;transition:border-color .25s ease\" style-focus=\"border-color:#C0593B\">\n            <\u002Flabel>\n          <\u002Fdiv>\n          <label style=\"display:flex;flex-direction:column;gap:9px\">\n            <span style=\"font-family:'Scenario',serif;font-weight:700;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8a8378\">Email<\u002Fspan>\n            <input value=\"{{ fEmail }}\" oninput=\"{{ onEmail }}\" placeholder=\"jane@northco.uk\" style=\"font-family:'Futura','Helvetica Neue',Arial,sans-serif;font-size:17px;color:#f1ece2;background:transparent;border:none;border-bottom:1px solid rgba(241,236,226,0.28);padding:10px 0;outline:none;transition:border-color .25s ease\" style-focus=\"border-color:#C0593B\">\n          <\u002Flabel>\n          <label style=\"display:flex;flex-direction:column;gap:9px\">\n            <span style=\"font-family:'Scenario',serif;font-weight:700;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#8a8378\">What should a customer feel on contact?<\u002Fspan>\n            <textarea value=\"{{ fMsg }}\" oninput=\"{{ onMsg }}\" rows=\"3\" placeholder=\"In a sentence or two…\" style=\"font-family:'Futura','Helvetica Neue',Arial,sans-serif;font-size:17px;color:#f1ece2;background:transparent;border:none;border-bottom:1px solid rgba(241,236,226,0.28);padding:10px 0;outline:none;resize:none;transition:border-color .25s ease\" style-focus=\"border-color:#C0593B\"><\u002Ftextarea>\n          <\u002Flabel>\n          <div style=\"min-height:18px\">\n            <sc-if value=\"{{ hasError }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"font-size:13px;color:#C0593B;font-style:italic\">{{ errorMsg }}<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <button type=\"submit\" disabled=\"{{ sending }}\" style=\"align-self:flex-start;font-family:'Scenario',serif;font-weight:700;font-size:12px;letter-spacing:0.14em;text-transform:uppercase;color:#1b1a17;background:#f1ece2;border:none;padding:16px 32px;border-radius:999px;cursor:pointer;transition:transform .25s ease,background .25s ease,opacity .25s ease\" style-hover=\"background:#C0593B;color:#f6f3ec;transform:translateY(-2px)\">{{ submitLabel }}<\u002Fbutton>\n          <p style=\"font-size:13px;line-height:1.55;color:#6f6a60;margin:6px 0 0;max-width:440px\">Your details stay with us — used only to reply to this enquiry, never shared or added to a list. Read our <a href=\"#\" style=\"color:#8a8378;text-decoration:underline;text-underline-offset:2px\">privacy notice<\u002Fa>.<\u002Fp>\n        <\u002Fform>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOOTER -->\n<footer style=\"background:#201e1a;color:#6f6a60;border-top:1px solid rgba(241,236,226,0.10)\">\n  <div data-nav=\"\" style=\"max-width:1180px;margin:0 auto;padding:34px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap\">\n    <p style=\"font-size:13px;line-height:1.5;margin:0;max-width:640px\">Aubrey North is a trading name of Cunning Corp Ltd, registered in England and Wales, and of Maurice James LLC-FZ, Dubai, UAE. Strategic and commercial advisory only — not legal or financial advice.<\u002Fp>\n    <p style=\"font-family:'Scenario',serif;font-weight:700;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;margin:0;color:#8a8378\">Clarity · Story · Understanding<\u002Fp>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  FORM_ENDPOINT = 'https://formspree.io/f/xzdqnogz';\n\n  state = {\n    idx: 3,\n    fName: '', fBiz: '', fEmail: '', fMsg: '',\n    error: '', sent: false, sentName: '', sending: false\n  };\n\n  pitches = [\n    { label: 'Three words', text: 'Clarity. Story. Understanding.', size: 'clamp(40px,7vw,86px)', lh: '1.04' },\n    { label: 'One line', text: 'We help businesses define the story people actually understand.', size: 'clamp(26px,4vw,46px)', lh: '1.14' },\n    { label: 'Short', text: 'Not branding, not marketing. We work on the narrative underneath both — because before any of it works, your business has to make sense to a human being. We help you say less, and make it land.', size: 'clamp(19px,2.3vw,27px)', lh: '1.42' },\n    { label: 'Fuller', text: 'Most businesses that aren\\u2019t converting don\\u2019t have a marketing problem — they have a clarity problem. No one quite understands who they are. Aubrey North is a boutique narrative advisory. We strip a business back to what it actually is, what its customer actually feels, and where the two have come apart — then rebuild the story so it lands immediately, feels intentional, and earns trust. We don\\u2019t help you say more. We help you say less, clearly.', size: 'clamp(16px,1.7vw,20px)', lh: '1.55' }\n  ];\n\n  countWords(t) {\n    return t.replace(/[\\u2014—.,]/g, ' ').split(/\\s+/).filter(Boolean).length;\n  }\n\n  componentDidMount() {\n    const els = Array.from(document.querySelectorAll('[data-reveal]'));\n    const show = (el) => { el.style.opacity = '1'; el.style.transform = 'none'; };\n    els.forEach(el => {\n      el.style.opacity = '0';\n      el.style.transform = 'translateY(20px)';\n      el.style.transition = 'opacity .9s cubic-bezier(.2,.7,.2,1), transform .9s cubic-bezier(.2,.7,.2,1)';\n    });\n    // Reveal anything already in (or near) the viewport right away — robust across bundlers/splash unpack.\n    const revealInView = () => {\n      const vh = window.innerHeight || document.documentElement.clientHeight;\n      els.forEach(el => {\n        if (el.style.opacity === '1') return;\n        const r = el.getBoundingClientRect();\n        if (r.top < vh * 0.94 && r.bottom > 0) show(el);\n      });\n    };\n    revealInView();\n    if (!('IntersectionObserver' in window)) {\n      els.forEach(show);\n      return;\n    }\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach(e => { if (e.isIntersecting) { show(e.target); io.unobserve(e.target); } });\n    }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });\n    els.forEach(el => { if (el.style.opacity !== '1') io.observe(el); });\n    // Safety nets: re-check after paint, and guarantee nothing stays hidden.\n    requestAnimationFrame(revealInView);\n    setTimeout(revealInView, 300);\n    this._revealSafety = setTimeout(() => els.forEach(show), 1600);\n\n    this.initFloatMarks();\n  }\n\n  initFloatMarks() {\n    const marks = Array.from(document.querySelectorAll('[data-floatmark]'));\n    if (!marks.length) return;\n    const mq = (q) => window.matchMedia && window.matchMedia(q).matches;\n    if (mq('(max-width: 768px)')) return; // marks are hidden on mobile\n    const reduce = mq('(prefers-reduced-motion: reduce)');\n\n    this._marks = marks.map((el, i) => {\n      const speed = 0.42 + i * 0.06;\n      const dir = i % 2 === 0 ? 1 : -1;\n      return {\n        el, parent: el.parentElement,\n        x: 0, y: 0,\n        vx: speed * dir,\n        vy: speed * (i === 2 ? -0.9 : 0.8),\n        w: 0, h: 0, pw: 0, ph: 0, avoid: [], placed: false\n      };\n    });\n\n    this._measureMarks = () => {\n      this._marks.forEach(m => {\n        const pr = m.parent.getBoundingClientRect();\n        m.pw = m.parent.clientWidth;\n        m.ph = m.parent.clientHeight;\n        m.w = m.el.offsetWidth || 120;\n        m.h = m.el.offsetHeight || 120;\n        m.avoid = Array.from(m.parent.querySelectorAll('[data-avoid]')).map(a => {\n          const r = a.getBoundingClientRect();\n          return { x: r.left - pr.left, y: r.top - pr.top, w: r.width, h: r.height };\n        });\n        if (!m.placed) {\n          const anchor = m.el.getAttribute('data-anchor') || 'tr';\n          if (anchor === 'bc') { m.x = (m.pw - m.w) / 2; m.y = m.ph - m.h - 56; }\n          else if (anchor === 'tl') { m.x = 40; m.y = 64; }\n          else { m.x = m.pw - m.w - 40; m.y = 64; }\n          m.placed = true;\n        }\n      });\n    };\n    this._measureMarks();\n    this._marks.forEach(m => { m.el.style.transform = 'translate(' + m.x + 'px,' + m.y + 'px)'; });\n    if (reduce) return; // place statically, no motion\n\n    const margin = 16, gap = 12;\n    this._stepMarks = () => {\n      for (const m of this._marks) {\n        if (!m.pw) continue;\n        m.x += m.vx; m.y += m.vy;\n        if (m.x < margin) { m.x = margin; m.vx = Math.abs(m.vx); }\n        if (m.x > m.pw - m.w - margin) { m.x = m.pw - m.w - margin; m.vx = -Math.abs(m.vx); }\n        if (m.y < margin) { m.y = margin; m.vy = Math.abs(m.vy); }\n        if (m.y > m.ph - m.h - margin) { m.y = m.ph - m.h - margin; m.vy = -Math.abs(m.vy); }\n        for (const r of m.avoid) {\n          if (m.x < r.x + r.w + gap && m.x + m.w + gap > r.x && m.y < r.y + r.h + gap && m.y + m.h + gap > r.y) {\n            const dL = (m.x + m.w) - (r.x - gap);\n            const dR = (r.x + r.w + gap) - m.x;\n            const dT = (m.y + m.h) - (r.y - gap);\n            const dB = (r.y + r.h + gap) - m.y;\n            const mn = Math.min(dL, dR, dT, dB);\n            if (mn === dL) { m.x = r.x - gap - m.w; m.vx = -Math.abs(m.vx); }\n            else if (mn === dR) { m.x = r.x + r.w + gap; m.vx = Math.abs(m.vx); }\n            else if (mn === dT) { m.y = r.y - gap - m.h; m.vy = -Math.abs(m.vy); }\n            else { m.y = r.y + r.h + gap; m.vy = Math.abs(m.vy); }\n          }\n        }\n        m.el.style.transform = 'translate(' + m.x.toFixed(2) + 'px,' + m.y.toFixed(2) + 'px)';\n      }\n      this._marksRaf = requestAnimationFrame(this._stepMarks);\n    };\n    this._marksRaf = requestAnimationFrame(this._stepMarks);\n\n    this._onMarksResize = () => { this._marks.forEach(m => m.placed = m.placed); this._measureMarks(); };\n    window.addEventListener('resize', this._onMarksResize);\n    setTimeout(this._measureMarks, 500);\n    setTimeout(this._measureMarks, 1800);\n  }\n\n  componentWillUnmount() {\n    if (this._revealSafety) clearTimeout(this._revealSafety);\n    if (this._marksRaf) cancelAnimationFrame(this._marksRaf);\n    if (this._onMarksResize) window.removeEventListener('resize', this._onMarksResize);\n  }\n\n  goContact = () => {\n    const el = document.getElementById('contact');\n    if (el) {\n      const top = el.getBoundingClientRect().top + window.scrollY - 0;\n      window.scrollTo({ top, behavior: 'smooth' });\n    }\n  };\n\n  sayLess = () => this.setState(s => ({ idx: Math.max(0, s.idx - 1) }));\n  sayMore = () => this.setState(s => ({ idx: Math.min(this.pitches.length - 1, s.idx + 1) }));\n  setIdx = (i) => this.setState({ idx: i });\n\n  onName = (e) => this.setState({ fName: e.target.value, error: '' });\n  onBiz = (e) => this.setState({ fBiz: e.target.value });\n  onEmail = (e) => this.setState({ fEmail: e.target.value, error: '' });\n  onMsg = (e) => this.setState({ fMsg: e.target.value, error: '' });\n\n  submit = async (e) => {\n    e.preventDefault();\n    if (this.state.sending) return;\n    const { fName, fBiz, fEmail, fMsg } = this.state;\n    if (!fName.trim()) return this.setState({ error: 'A name, to start.' });\n    if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(fEmail.trim())) return this.setState({ error: 'A real email, so we can reply.' });\n    if (!fMsg.trim()) return this.setState({ error: 'One line on what a customer should feel.' });\n\n    this.setState({ sending: true, error: '' });\n    try {\n      const res = await fetch(this.FORM_ENDPOINT, {\n        method: 'POST',\n        headers: { 'Accept': 'application/json' },\n        body: (() => {\n          const fd = new FormData();\n          fd.append('name', fName.trim());\n          fd.append('business', fBiz.trim());\n          fd.append('email', fEmail.trim());\n          fd.append('feeling', fMsg.trim());\n          fd.append('_subject', 'New Coffee + Chat enquiry — ' + fName.trim());\n          return fd;\n        })()\n      });\n      if (res.ok) {\n        this.setState({ sent: true, sending: false, sentName: fName.trim().split(/\\s+/)[0] });\n      } else {\n        let msg = 'Something went wrong sending that. Email us directly and we\\u2019ll sort it.';\n        try {\n          const data = await res.json();\n          if (data && data.errors && data.errors.length) msg = data.errors.map(x => x.message).join(' ');\n        } catch (_) {}\n        this.setState({ sending: false, error: msg });\n      }\n    } catch (_) {\n      this.setState({ sending: false, error: 'Network hiccup — check your connection and try once more.' });\n    }\n  };\n\n  renderVals() {\n    const p = this.pitches[this.state.idx];\n    const accent = '#C0593B';\n\n    const pitchEl = React.createElement('p', {\n      key: this.state.idx,\n      style: {\n        fontFamily: \"'Recoleta', Georgia, serif\", fontWeight: 300,\n        fontSize: p.size, lineHeight: p.lh, letterSpacing: '-0.01em',\n        margin: 0, color: '#f6f3ec', textWrap: 'pretty',\n        animation: 'anFade .55s cubic-bezier(.2,.7,.2,1) both'\n      }\n    }, p.text);\n\n    const dotsEl = this.pitches.map((pp, i) => React.createElement('button', {\n      key: i,\n      onClick: () => this.setIdx(i),\n      title: pp.label,\n      style: {\n        width: i === this.state.idx ? '22px' : '8px', height: '8px',\n        borderRadius: '999px', border: 'none', cursor: 'pointer', padding: 0,\n        background: i === this.state.idx ? accent : 'rgba(241,236,226,0.30)',\n        transition: 'all .3s cubic-bezier(.2,.7,.2,1)'\n      }\n    }));\n\n    const baseBtn = {\n      flex: 1, fontFamily: \"'Scenario', serif\", fontWeight: 700, fontSize: '12px',\n      letterSpacing: '0.12em', textTransform: 'uppercase', padding: '20px 22px',\n      border: 'none', cursor: 'pointer', transition: 'background .25s ease, color .25s ease',\n      background: 'transparent'\n    };\n    const atMin = this.state.idx === 0;\n    const atMax = this.state.idx === this.pitches.length - 1;\n\n    return {\n      lengthLabel: p.label,\n      wordCount: this.countWords(p.text),\n      pitchEl, dotsEl,\n      sayLess: this.sayLess, sayMore: this.sayMore,\n      atMin, atMax,\n      lessBtnStyle: { ...baseBtn, color: atMin ? '#5a554c' : '#f1ece2', cursor: atMin ? 'default' : 'pointer' },\n      moreBtnStyle: { ...baseBtn, color: atMax ? '#5a554c' : '#f1ece2', cursor: atMax ? 'default' : 'pointer' },\n      goContact: this.goContact,\n      tiers: [\n        { no: '01', name: 'Coffee + Chat', desc: 'A relaxed, focused conversation about how you see the business and where the friction is.', price: 'Complimentary' },\n        { no: '02', name: 'The One Recommendation', desc: 'A single, focused fix on the most critical issue, delivered as an Aubrey North Note.', price: '£500' },\n        { no: '03', name: 'Weekly Intensive', desc: 'Focused weekly sprints to identify and fix the core narrative issues. Most run two to three weeks.', price: '£2,500 / week' },\n        { no: '04', name: 'Ongoing Advisory', desc: 'By invitation. For businesses that want a steady hand on the narrative over time.', price: '£1–2k / month' }\n      ],\n      sent: this.state.sent,\n      notSent: !this.state.sent,\n      sentName: this.state.sentName,\n      fName: this.state.fName, fBiz: this.state.fBiz, fEmail: this.state.fEmail, fMsg: this.state.fMsg,\n      onName: this.onName, onBiz: this.onBiz, onEmail: this.onEmail, onMsg: this.onMsg,\n      submit: this.submit,\n      sending: this.state.sending,\n      submitLabel: this.state.sending ? 'Sending…' : 'Request a coffee',\n      hasError: !!this.state.error, errorMsg: this.state.error\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"},"entry":"Aubrey North.dc"}
